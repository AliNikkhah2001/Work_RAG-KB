[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-manager"
version = "0.1.0"
description = "Knowledge Base Management System for ICS Credit Scoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "pgvector>=0.3.0",
    "hazm>=0.10.0",
    "shekar>=0.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
kb-manager = "kb_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kb_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
