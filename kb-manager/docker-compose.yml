services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kb_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kb-manager:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DB mode switch: sqlite (light) | pgvector (production)
      # Set to 'sqlite' for local/test, 'pgvector' for postgres+pgvector
      KB_DB_MODE: pgvector
      KB_DB_HOST: postgres
      KB_DB_PORT: 5432
      KB_DB_NAME: kb_manager
      KB_DB_USER: postgres
      KB_DB_PASSWORD: postgres
      KB_WEB_HOST: 0.0.0.0
      KB_WEB_PORT: 8000
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
