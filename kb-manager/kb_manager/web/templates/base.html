<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KB Manager{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/lib/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" onerror="console.warn('CDN Chart.js failed, using local stub')"></script>
    <script>if(typeof Chart==='undefined'){window.Chart=function(){return{update:function(){},data:{datasets:[]}}};window.Chart.register=function(){};console.warn('Chart.js not loaded, using stub - charts disabled');}</script>
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>KB Manager</h2>
                <p class="subtitle">Knowledge Base Management System</p>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a></li>
                <li><a href="/documents" class="nav-link {% if '/documents' in request.url.path %}active{% endif %}">Documents</a></li>
                <li><a href="/chunks" class="nav-link {% if '/chunks' in request.url.path %}active{% endif %}">Chunks</a></li>
                <li><a href="/pipeline" class="nav-link {% if '/pipeline' in request.url.path %}active{% endif %}">Pipeline</a></li>
                <li><a href="/versions" class="nav-link {% if '/versions' in request.url.path %}active{% endif %}">Versions</a></li>
                <li><a href="/monitoring" class="nav-link {% if '/monitoring' in request.url.path %}active{% endif %}">Monitoring</a></li>
                <li><a href="/cleanup/qa" class="nav-link {% if '/cleanup' in request.url.path %}active{% endif %}">Cleanup QA</a></li>
                <li><a href="/search" class="nav-link {% if '/search' in request.url.path %}active{% endif %}">Search</a></li>
                <li><a href="/transparency" class="nav-link {% if '/transparency' in request.url.path %}active{% endif %}">Transparency</a></li>
                <li><a href="/benchmarks" class="nav-link {% if '/benchmarks' in request.url.path %}active{% endif %}">Benchmarks</a></li>
                <li><a href="/benchmarks/comparison" class="nav-link {% if '/benchmarks/comparison' in request.url.path %}active{% endif %}">Comparison</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <header class="content-header">
                {% block header %}{% endblock %}
            </header>
            <div class="content-body">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
